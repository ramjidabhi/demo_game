apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demogame.fullname" . }}
  labels:
    {{- include "demogame.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "demogame.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demogame.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "demogame.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if .Values.persistence.enabled }}
      initContainers:
        - name: initialize-database
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p /data

              if [ ! -s /data/game_history.db ]; then
                if [ -s /app/data/game_history.db ]; then
                  echo "Copying original game database into Azure Disk..."
                  cp /app/data/game_history.db /data/game_history.db
                else
                  echo "No existing database found. Application will initialize a new database."
                fi
              else
                echo "Existing persistent database found. Keeping it unchanged."
              fi

              chown 1001:1001 /data

              if [ -f /data/game_history.db ]; then
                chown 1001:1001 /data/game_history.db
                chmod 660 /data/game_history.db
              fi
          volumeMounts:
            - name: game-data
              mountPath: /data
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: SQLITE_PATH
              value: "/app/data/game_history.db"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: game-data
              mountPath: /app/data
          {{- end }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: game-data
          persistentVolumeClaim:
            claimName: {{ include "demogame.fullname" . }}-data
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
