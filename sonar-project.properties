# ==========================================
# SONARQUBE - DEMO GAME
# PROJECT-SPECIFIC CONFIGURATION
# ==========================================

# 1. Project identification
sonar.projectKey=demo_game
sonar.projectName=Demo Game
sonar.projectVersion=1.0

# 2. Source code
sonar.sources=.

# 3. Test code
sonar.tests=.
sonar.test.inclusions=**/test_suite.py

# 4. Exclude tests from main source scope
# They are analyzed separately as test code.

# 5. Encoding
sonar.sourceEncoding=UTF-8

# 6. Generated files and dependencies
sonar.exclusions=**/test_suite.py,**/.git/**,**/.scannerwork/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/venv/**,**/node_modules/**,**/build/**,**/dist/**,**/target/**,**/coverage/**,**/bin/**,**/obj/**,**/.terraform/**,**/*.tfstate,**/*.tfstate.*,**/*.tfvars,**/*.tfvars.json,**/*.db,**/*.sqlite,**/*.sqlite3,**/.env,**/.env.*,**/*.bak,**/*.backup,**/*.exe,**/*.dll,**/*.log

# 7. Scanner Java runtime
# Use existing local Java instead of downloading another JRE
sonar.scanner.skipJreProvisioning=true

# 8. Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300