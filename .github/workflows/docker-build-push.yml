name: Demo Game CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ramji55/demo_game_web
  HELM_RELEASE: demo-game
  HELM_CHART: ./helm
  K8S_NAMESPACE: default

jobs:

  # ==========================================
  # JOB 1: APPLICATION TESTING
  # ==========================================

  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      - name: Run Unit Tests
        run: |
          if [ -d tests ] && find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest tests/ -v
          else
            echo "No automated tests found. Skipping tests."
          fi

  # ==========================================
  # JOB 2: DOCKER BUILD AND PUSH
  # ==========================================

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image Information
        run: |
          echo "Image pushed successfully!"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ==========================================
  # JOB 3: HELM VALIDATION
  # ==========================================

  helm-validation:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm Chart
        run: |
          helm lint ${{ env.HELM_CHART }}
          helm template ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }}

  # ==========================================
  # JOB 4: KUBERNETES DEPLOYMENT
  # ==========================================

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - helm-validation

    if: github.event_name == 'push'

    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes Access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Application with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Verify Kubernetes Deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get services -n ${{ env.K8S_NAMESPACE }}

      - name: Cleanup Kubernetes Credentials
        if: always()
        run: |
          rm -f "$HOME/.kube/config"