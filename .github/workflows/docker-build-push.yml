
name: CYBER VIPER DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: DOCKER BUILD, TEST AND SECURITY SCAN
  # ==========================================

  validate-test-scan:
    name: Docker tests and Trivy scans
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE: cyber-viper:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================
      # FILESYSTEM SECURITY SCAN
      # ======================================

      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-fs-report.json
          skip-dirs: .git,.terraform,__pycache__,.venv,venv

      # ======================================
      # DOCKER BUILD
      # ======================================

      - name: Build application Docker image
        run: |
          docker build --pull --tag "$IMAGE" .

      # ======================================
      # PYTHON COMPILATION
      # ======================================

      - name: Compile Python application
        run: |
          docker run --rm \
            --env SQLITE_PATH=/tmp/cyber-viper-compile.db \
            "$IMAGE" \
            python -m compileall -q server.py database.py test_suite.py

      # ======================================
      # APPLICATION TESTS
      # ======================================

      - name: Run application tests
        run: |
          docker run --rm \
            --env SQLITE_PATH=/tmp/cyber-viper-tests.db \
            "$IMAGE" \
            python test_suite.py

      # ======================================
      # DOCKER IMAGE SECURITY SCAN
      # ======================================

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cyber-viper:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-image-report.json

      # ======================================
      # DOCKER HEALTH CHECK
      # ======================================

      - name: Run application container and verify health
        shell: bash
        run: |
          set -Eeuo pipefail

          CONTAINER_NAME="cyber-viper-ci-${GITHUB_RUN_ID}"

          cleanup() {
            docker logs "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:18000:8000 \
            --env SQLITE_PATH=/tmp/cyber-viper-runtime.db \
            "$IMAGE"

          echo "Waiting for Docker HEALTHCHECK..."

          for attempt in $(seq 1 40); do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$CONTAINER_NAME")

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container became unhealthy."
              exit 1
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Container health check timed out."
              exit 1
            fi

            sleep 2
          done

          echo "Checking application endpoints..."

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/health

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/metrics \
            | grep -q "cyber_viper_build_info"

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/api/stats \
            | grep -q "total_games"

          echo "PASS: Application health checks successful."

      # ======================================
      # DOCKER HUB LOGIN
      # ======================================

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ======================================
      # PUSH IMAGE TO DOCKER HUB
      # ======================================

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail

          REMOTE_IMAGE="${DOCKERHUB_USERNAME}/cyber-viper"

          docker tag "$IMAGE" "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker tag "$IMAGE" "${REMOTE_IMAGE}:latest"

          docker push "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker push "${REMOTE_IMAGE}:latest"

          echo "PASS: Docker images published successfully."

      # ======================================
      # SECURITY FINDINGS REPORT
      # ======================================

      - name: Report HIGH and CRITICAL findings
        if: always()
        shell: bash
        run: |
          set -u

          echo "======================================"
          echo "CYBER VIPER SECURITY REPORT"
          echo "======================================"

          if [ -s trivy-fs-report.json ]; then
            echo "Filesystem findings:"

            jq '
              [
                .Results[]? |
                (
                  .Vulnerabilities[]?,
                  .Misconfigurations[]?,
                  .Secrets[]?
                ) |
                select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
              ] |
              {
                total: length,
                findings: .
              }
            ' trivy-fs-report.json
          else
            echo "WARNING: Filesystem report missing."
          fi

          if [ -s trivy-image-report.json ]; then
            echo "Docker image findings:"

            jq '
              [
                .Results[]? |
                .Vulnerabilities[]? |
                select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
              ] |
              {
                total: length,
                findings: .
              }
            ' trivy-image-report.json
          else
            echo "WARNING: Image report missing."
          fi

          echo "Security findings are report-only."
          echo "Continuing pipeline."

      # ======================================
      # UPLOAD TRIVY REPORTS
      # ======================================

      - name: Upload Trivy security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-viper-trivy-reports
          path: |
            trivy-fs-report.json
            trivy-image-report.json
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================
  # JOB 2: SONARQUBE CLOUD CODE ANALYSIS
  # ==========================================

  sonarqube-analysis:
    name: SonarQube Cloud code quality analysis
    runs-on: ubuntu-latest
    needs: validate-test-scan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    timeout-minutes: 20

    env:
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================
      # VALIDATE SONAR CONFIGURATION
      # ======================================

      - name: Verify SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is missing."
            exit 1
          fi

          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "ERROR: SONAR_ORGANIZATION variable is missing."
            exit 1
          fi

          if [ "$SONAR_ORGANIZATION" = "YOUR_ACTUAL_ORGANIZATION_KEY" ]; then
            echo "ERROR: Replace the placeholder organization key."
            exit 1
          fi

          echo "SonarQube configuration is present."
          echo "Organization variable is configured."

      # ======================================
      # JAVA 21
      # ======================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version

      # ======================================
      # SONARQUBE CLOUD ANALYSIS
      # ======================================

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=cyber-viper
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.scanner.skipJreProvisioning=false
            -Dsonar.qualitygate.wait=false

      # ======================================
      # SONARQUBE RESULT
      # ======================================

      - name: SonarQube analysis summary
        if: success()
        run: |
          echo "======================================"
          echo "SONARQUBE CLOUD ANALYSIS UPLOADED"
          echo "======================================"
          echo "Check SonarQube Cloud for analysis results."
