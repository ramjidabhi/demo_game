
name: CYBER VIPER DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-scan:
    name: Tests, Helm validation and Trivy security scans
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.docker.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.docker.txt

      - name: Run application tests
        run: |
          python -m compileall -q server.py database.py test_suite.py
          python test_suite.py

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint ./demogame
          helm template cyber-viper ./demogame \
            --namespace cyber-viper \
            > rendered-manifests.yaml

      - name: Scan source, dependencies, secrets and configuration with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-fs-report.json
          skip-dirs: .git,.terraform,__pycache__,.venv,venv

      - name: Build application container image
        run: |
          docker build --pull \
            -t cyber-viper:${{ github.sha }} .

      - name: Scan application container image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: cyber-viper:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-image-report.json

      - name: Enforce HIGH and CRITICAL security threshold
        shell: bash
        run: |
          set -e

          if [ ! -s trivy-fs-report.json ]; then
            echo "ERROR: Filesystem scan report is missing."
            exit 1
          fi

          if [ ! -s trivy-image-report.json ]; then
            echo "ERROR: Container image scan report is missing."
            exit 1
          fi

          if ! jq -e '
            [
              .Results[]? |
              (
                .Vulnerabilities[]?,
                .Misconfigurations[]?,
                .Secrets[]?
              ) |
              select(
                .Severity == "HIGH" or
                .Severity == "CRITICAL"
              )
            ] | length == 0
          ' trivy-fs-report.json > /dev/null; then
            echo "FAILED: HIGH or CRITICAL filesystem findings detected."
            exit 1
          fi

          if ! jq -e '
            [
              .Results[]? |
              .Vulnerabilities[]? |
              select(
                .Severity == "HIGH" or
                .Severity == "CRITICAL"
              )
            ] | length == 0
          ' trivy-image-report.json > /dev/null; then
            echo "FAILED: HIGH or CRITICAL image vulnerabilities detected."
            exit 1
          fi

          echo "PASS: No HIGH or CRITICAL findings detected."

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-viper-trivy-reports
          path: |
            trivy-fs-report.json
            trivy-image-report.json
          if-no-files-found: ignore
          retention-days: 14

  sonarqube-analysis:
    name: SonarQube code quality analysis
    if: ${{ vars.SONARQUBE_LOCAL == 'true' && github.event_name == 'push' }}
    runs-on: [self-hosted, windows, x64]
    needs: validate-test-scan
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local DevOps network and token
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "Add SONAR_TOKEN as a GitHub Actions repository secret."
          }

          docker network inspect devops-tools_default *> $null

          if ($LASTEXITCODE -ne 0) {
            throw "Start the local DevOps stack before running this job."
          }

      - name: Run SonarQube Scanner
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm `
            --network devops-tools_default `
            -e SONAR_HOST_URL="http://sonarqube:9000" `
            -e SONAR_TOKEN `
            -v "$($env:GITHUB_WORKSPACE):/usr/src" `
            -w /usr/src `
            sonarsource/sonar-scanner-cli:latest
