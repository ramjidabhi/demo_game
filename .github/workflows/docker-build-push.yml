
name: CYBER VIPER DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-scan:
    name: Docker tests and Trivy scans
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE: cyber-viper:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kubernetes and Helm steps removed.

      - name: Scan source, dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-fs-report.json
          skip-dirs: .git,.terraform,__pycache__,.venv,venv

      - name: Build application Docker image
        run: |
          docker build --pull --tag "$IMAGE" .

      - name: Compile Python code inside Docker image
        run: |
          docker run --rm \
            --env SQLITE_PATH=/tmp/cyber-viper-compile.db \
            "$IMAGE" \
            python -m compileall -q server.py database.py test_suite.py

      - name: Run application tests inside Docker image
        run: |
          docker run --rm \
            --env SQLITE_PATH=/tmp/cyber-viper-tests.db \
            "$IMAGE" \
            python test_suite.py

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cyber-viper:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-image-report.json

      - name: Run application container and verify health
        shell: bash
        run: |
          set -Eeuo pipefail

          CONTAINER_NAME="cyber-viper-ci-${GITHUB_RUN_ID}"

          cleanup() {
            docker logs "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:18000:8000 \
            --env SQLITE_PATH=/tmp/cyber-viper-runtime.db \
            "$IMAGE"

          echo "Waiting for Docker HEALTHCHECK..."

          for attempt in $(seq 1 40); do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$CONTAINER_NAME")

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container became unhealthy."
              exit 1
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Container health check timed out."
              exit 1
            fi

            sleep 2
          done

          echo "Checking application HTTP endpoints..."

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/health

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/metrics \
            | grep -q "cyber_viper_build_info"

          curl --fail --silent --show-error \
            http://127.0.0.1:18000/api/stats \
            | grep -q "total_games"

          echo "PASS: Docker container and application endpoints are healthy."

      - name: Report HIGH and CRITICAL security findings
        if: always()
        shell: bash
        run: |
          set -u

          echo "======================================"
          echo "CYBER VIPER SECURITY SCAN SUMMARY"
          echo "======================================"

          if [ -s trivy-fs-report.json ]; then
            echo "Filesystem scan:"

            jq '
              [
                .Results[]? |
                (
                  .Vulnerabilities[]?,
                  .Misconfigurations[]?,
                  .Secrets[]?
                ) |
                select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
              ] |
              {
                total: length,
                findings: .
              }
            ' trivy-fs-report.json
          else
            echo "WARNING: Filesystem report missing."
          fi

          if [ -s trivy-image-report.json ]; then
            echo "Docker image scan:"

            jq '
              [
                .Results[]? |
                .Vulnerabilities[]? |
                select(
                  .Severity == "HIGH" or
                  .Severity == "CRITICAL"
                )
              ] |
              {
                total: length,
                findings: .
              }
            ' trivy-image-report.json
          else
            echo "WARNING: Docker image report missing."
          fi

          echo "======================================"
          echo "Security findings are non-blocking."
          echo "Continuing pipeline."
          echo "======================================"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-viper-trivy-reports
          path: |
            trivy-fs-report.json
            trivy-image-report.json
          if-no-files-found: ignore
          retention-days: 14

  sonarqube-analysis:
    name: SonarQube code quality analysis
    if: ${{ vars.SONARQUBE_LOCAL == 'true' && github.event_name == 'push' }}
    runs-on: [self-hosted, windows, x64]
    needs: validate-test-scan
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local DevOps network and token
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "Add SONAR_TOKEN as a GitHub Actions repository secret."
          }

          docker network inspect devops-tools_default *> $null

          if ($LASTEXITCODE -ne 0) {
            throw "Start the local DevOps stack before running this job."
          }

      - name: Run SonarQube Scanner
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm `
            --network devops-tools_default `
            -e SONAR_HOST_URL="http://sonarqube:9000" `
            -e SONAR_TOKEN `
            -v "$($env:GITHUB_WORKSPACE):/usr/src" `
            -w /usr/src `
            sonarsource/sonar-scanner-cli:latest
