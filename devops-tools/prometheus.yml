global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cyber-viper"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          application: "CYBER VIPER"
          environment: "local"
